# This YAML file creates three Kubernetes objects:
# PersistentVolumeClaim
# → holds the SQLite file of registered users
# Deployment
# → creates and maintains the API Pod(it runs the GO API server)
# Service
# → provides a stable network address for the Pod
# Pods can be replaced and receive new IP addresses. The Service remains stable.
# Holds the SQLite file with the registered users, so accounts survive
# a Pod restart or a new image rollout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: week3-paas-api-users
  namespace: paas-system
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: premium-perf1-stackit

  resources:
    requests:
      storage: 1Gi

---
# Runs the Go API as a Kubernetes workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week3-paas-api
  namespace: paas-system
spec:
  replicas: 1

  # SQLite on a ReadWriteOnce volume cannot be shared by two Pods, so the old
  # Pod must be gone before the new one starts.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: week3-paas-api

  template:
    metadata:
      labels:
        app: week3-paas-api

    spec:
      serviceAccountName: week3-paas-api

      # Credentials used only for pulling the private image.
      imagePullSecrets:
        - name: stackit-registry

      # Alpine's non-root "app" user is UID/GID 100. fsGroup lets that
      # user write the SQLite file on the mounted volume. runAsUser must
      # be numeric so kubelet can honour runAsNonRoot.
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: registry.onstackit.cloud/gaurav-paas-20a60c06/week3-paas-api:v1.4.11
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: week3-paas-api-auth
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: week3-paas-api-auth
                  key: ADMIN_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: week3-paas-api-auth
                  key: JWT_SECRET

            # PostgreSQL resources are managed in this namespace.
            - name: PAAS_NAMESPACE
              value: database-services

            - name: PORT
              value: "8080"

            - name: USER_DB_PATH
              value: /data/users.db

            # Internal Loki address used by the API to retrieve logs.
            - name: LOKI_URL
              value: "http://loki-gateway.logging.svc.cluster.local"

          volumeMounts:
            - name: users-db
              mountPath: /data

          # Kubernetes checks whether the process is alive.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 3000

          # Kubernetes sends traffic only when the API is ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: users-db
          persistentVolumeClaim:
            claimName: week3-paas-api-users

---
# Provides a stable internal address for the API Pods.
apiVersion: v1
kind: Service
metadata:
  name: week3-paas-api
  namespace: paas-system
spec:
  selector:
    app: week3-paas-api

  ports:
    - name: http
      port: 80
      targetPort: http

  type: ClusterIP
