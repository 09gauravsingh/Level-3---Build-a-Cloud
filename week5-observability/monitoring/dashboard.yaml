apiVersion: v1
kind: ConfigMap

metadata:
  name: week3-paas-api-dashboard
  namespace: monitoring

  # Grafana's dashboard sidecar watches for this label.
  labels:
    grafana_dashboard: "1"

data:
  week3-paas-api-dashboard.json: |
    {
      "annotations": {
        "list": []
      },

      "editable": true,

      "graphTooltip": 1,

      "title": "PostgreSQL PaaS - Go API",

      "uid": "week3-paas-api",

      "timezone": "browser",

      "schemaVersion": 39,

      "refresh": "10s",

      "time": {
        "from": "now-1h",
        "to": "now"
      },

      "panels": [

        {
          "type": "stat",
          "title": "Total HTTP Requests",
          "id": 1,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "sum(total_http_requests)",
              "refId": "A"
            }
          ],

          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          }
        },

        {
          "type": "stat",
          "title": "Requests / Second",
          "id": 2,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "sum(rate(total_http_requests[5m]))",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },

          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          }
        },

        {
          "type": "stat",
          "title": "p95 Request Latency",
          "id": 3,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },

          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          }
        },

        {
          "type": "stat",
          "title": "Go Goroutines",
          "id": 4,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "go_goroutines",
              "refId": "A"
            }
          ],

          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          }
        },

        {
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "id": 5,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "sum(rate(total_http_requests[5m]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },

          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          }
        },

        {
          "type": "timeseries",
          "title": "Requests by HTTP Status",
          "id": 6,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "sum by (status) (rate(total_http_requests[5m]))",
              "legendFormat": "HTTP {{status}}",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },

          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          }
        },

        {
          "type": "timeseries",
          "title": "Requests by API Endpoint",
          "id": 7,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "sum by (method, path) (rate(total_http_requests[5m]))",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },

          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          }
        },

        {
          "type": "timeseries",
          "title": "p95 Latency by Endpoint",
          "id": 8,

          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },

          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, method, path) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],

          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },

          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          }
        }
      ]
    }