#Connect Loki to your existing Grafana

apiVersion: v1
kind: ConfigMap

metadata:
  name: loki-grafana-datasource
  namespace: monitoring

  labels:
    grafana_datasource: "1"

data:
  loki.yaml: |
    apiVersion: 1

    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.logging.svc.cluster.local
        isDefault: false